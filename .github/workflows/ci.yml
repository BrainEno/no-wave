name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:routes

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bot_thk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bot-thk/api test:integration

  # Proves the documented local chain on both persistence providers:
  # migrate -> start the API -> probe it, then build the Web app and probe the
  # Web -> API path. The probe is the same `pnpm check:local` developers run, so
  # a broken local setup fails here instead of on someone's laptop.
  local-dev-chain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_PROVIDER: ${{ matrix.provider }}
      DATABASE_URL: ${{ matrix.provider == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/bot_thk_dev' || '' }}
      AUTH_JWT_SECRET: local-development-ci-secret-0123456789abcdef
      AUTH_JWT_ISSUER: http://localhost:4000
      AUTH_JWT_AUDIENCE: no-wave
      API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations for ${{ matrix.provider }}
        run: pnpm db:migrate
      # Runs the documented developer command: start the processes, wait for
      # readiness, probe the chain, stop, and exit with the probe result. No
      # background process has to survive between steps.
      - name: Probe database -> API
        if: matrix.provider == 'postgres'
        run: pnpm dev --api-only --check --exit
      - name: Probe database -> API -> Web
        if: matrix.provider == 'sqlite'
        run: pnpm dev --check --exit

  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs:
      - verify
      - postgres-integration
      - local-dev-chain
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          LOCAL_CHAIN_RESULT: ${{ needs.local-dev-chain.result }}
        run: |
          printf 'verify: %s\npostgres-integration: %s\nlocal-dev-chain: %s\n' \
            "$VERIFY_RESULT" "$POSTGRES_RESULT" "$LOCAL_CHAIN_RESULT"
          if [ "$VERIFY_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ] || [ "$LOCAL_CHAIN_RESULT" != "success" ]; then
            echo "::error::verify, postgres-integration and local-dev-chain must all succeed."
            exit 1
          fi
          echo "All required validation jobs succeeded."
