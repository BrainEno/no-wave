name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:routes

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bot_thk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bot-thk/api test:integration

  # Proves the documented local chain on both persistence providers:
  # migrate -> start the API -> probe it, then build the Web app and probe the
  # Web -> API path. The probe is the same `pnpm check:local` developers run, so
  # a broken local setup fails here instead of on someone's laptop.
  local-dev-chain:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_PROVIDER: ${{ matrix.provider }}
      DATABASE_URL: ${{ matrix.provider == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/bot_thk_dev' || '' }}
      AUTH_JWT_SECRET: local-development-ci-secret-0123456789abcdef
      AUTH_JWT_ISSUER: http://localhost:4000
      AUTH_JWT_AUDIENCE: no-wave
      API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations for ${{ matrix.provider }}
        run: pnpm db:migrate
      # Runs the documented developer command: start the processes, wait for
      # readiness, probe the chain, stop, and exit with the probe result. No
      # background process has to survive between steps.
      - name: Probe database -> API
        if: matrix.provider == 'postgres'
        run: pnpm dev --api-only --check --exit
      - name: Probe database -> API -> Web
        if: matrix.provider == 'sqlite'
        run: pnpm dev --check --exit

  # Browser-level assertions for the journeys no cheaper layer can see: Lexical
  # editing, the save/publish round trip, and the generated slug and summary.
  # Playwright drives the same local stack developers start with `pnpm dev`; the
  # browser download needs network access, which is why this is a CI job and not
  # part of `pnpm test`.
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: ""
      # A disposable database: the suite registers accounts and writes articles,
      # so nothing it creates should outlive the job. A literal path rather than
      # `${{ runner.temp }}` — a job-level `env` entry that expands the `runner`
      # context is rejected when the workflow file is validated, and the run then
      # starts zero jobs ("workflow file may be broken") instead of failing a
      # step. `/tmp` on a GitHub-hosted runner is writable and is discarded with
      # the VM the job ran on.
      DATABASE_PATH: /tmp/no-wave-e2e.sqlite
      AUTH_JWT_SECRET: local-development-ci-secret-0123456789abcdef
      AUTH_JWT_ISSUER: http://localhost:4000
      AUTH_JWT_AUDIENCE: no-wave
      # The suite registers one account per journey, and one journey needs a
      # second account in it — the reader who is told about a deletion is not
      # the author who made it. Behind one address the API allows 20
      # registrations an hour, which the suite now passes; this widens the
      # budget for the disposable API instance only, and leaves the default —
      # the one a deployment runs with — untouched.
      AUTH_REGISTER_IP_LIMIT: "60"
      API_BASE_URL: http://127.0.0.1:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations
        run: pnpm db:migrate
      # The suite drives the production builds, so they have to exist first:
      # both frameworks, because the same journey runs against each.
      - name: Build the Web application
        run: pnpm build
      - name: Build the React Router prototype
        run: pnpm --filter @bot-thk/web-rr build
      - name: Install the Chromium build Playwright drives
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the browser-level suite
        run: pnpm test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phase 1 of the Web framework migration: the isolated React Router prototype
  # must build and pass its behavior tests on plain Node.js. The job starts the
  # production build with `node server.ts` and NO Vercel-specific variables, so a
  # platform dependency cannot sneak in unnoticed.
  react-router-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build and behavior-test the prototype
        run: pnpm test:prototype

  # Phase 6, item 1: the whole stack has to come up on plain Node.js with only
  # the variables documented in `.env.example`. `pnpm stack:check` builds the
  # React Router app, migrates the database, starts the API and the Web server
  # as child processes that inherit the OS minimum plus their documented role
  # variables — and nothing else — probes the chain over HTTP, stops both
  # children and exits non-zero on the first failure.
  #
  # No platform variable is set in this job, and the children could not read one
  # if it were: `API_SERVICE_URL`, `API_GRAPHQL_URL` and the `VERCEL*` set are
  # deleted from every child environment. On the PostgreSQL leg the probe also
  # runs the notification outbox drain, which SQLite has no durable table for.
  portable-stack:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        provider: [sqlite, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_dev"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_PROVIDER: ${{ matrix.provider }}
      DATABASE_URL: ${{ matrix.provider == 'postgres' && 'postgres://postgres:postgres@127.0.0.1:5432/bot_thk_dev' || '' }}
      # A disposable file: the probe registers accounts and publishes an
      # article, and `/tmp` is discarded with the runner.
      DATABASE_PATH: /tmp/no-wave-portable.sqlite
      AUTH_JWT_SECRET: portable-stack-ci-secret-0123456789abcdef
      AUTH_JWT_ISSUER: http://127.0.0.1:4000
      AUTH_JWT_AUDIENCE: no-wave
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The command builds the Web app itself, so no separate build step: the
      # point is that a clean checkout needs exactly one command.
      - name: Bring the whole stack up and probe it (${{ matrix.provider }})
        run: pnpm stack:check

  # Phase 6, item 2: the deployment artifacts. The React Router app ships as a
  # container image, and "it builds" is not the claim — the image is started
  # next to the API image and probed over HTTP, so a broken runtime dependency
  # (a package that is only present because devDependencies were installed)
  # fails here instead of on a host. Both images are built from the repository's
  # single lockfile with production dependencies only in the runtime stage.
  container-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the API image
        run: |
          set -eu
          if ! docker build -f apps/api/Dockerfile.vercel -t bot-thk-api:ci . > /tmp/api-build.log 2>&1; then
            tail -n 60 /tmp/api-build.log
            MESSAGE=$(tail -n 25 /tmp/api-build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=docker build (apps/api/Dockerfile.vercel)::${MESSAGE}"
            exit 1
          fi
          tail -n 3 /tmp/api-build.log
      - name: Build the React Router image
        run: |
          set -eu
          if ! docker build -f apps/web-rr/Dockerfile -t bot-thk-web-rr:ci . > /tmp/web-rr-build.log 2>&1; then
            tail -n 60 /tmp/web-rr-build.log
            MESSAGE=$(tail -n 25 /tmp/web-rr-build.log | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')
            echo "::error title=docker build (apps/web-rr/Dockerfile)::${MESSAGE}"
            exit 1
          fi
          tail -n 3 /tmp/web-rr-build.log
      # The image is worth as much as what it serves: start both containers on
      # one network — the Web tier reaching the API by `API_BASE_URL` alone, no
      # platform binding and no localhost shortcut — and probe them from
      # outside like any other HTTP client would.
      - name: Run both images and probe them over HTTP
        run: |
          set -eu
          docker network create nw-ci
          docker run -d --network nw-ci --name api \
            -e HOST=0.0.0.0 -e PORT=80 \
            -e DATABASE_PROVIDER=sqlite -e DATABASE_PATH=/tmp/api.sqlite \
            -e AUTH_JWT_SECRET=container-image-ci-secret-0123456789abcdef \
            -p 4000:80 bot-thk-api:ci
          # Migrations stay an explicit step inside the container too: the image
          # never mutates a schema on boot.
          docker exec api node apps/api/src/persistence/migrate.ts
          docker run -d --network nw-ci --name web \
            -e HOST=0.0.0.0 -e PORT=3100 \
            -e API_BASE_URL=http://api:80 \
            -e NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3100 \
            -p 3100:3100 bot-thk-web-rr:ci

          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health || true)" = "200" ]; then break; fi
            sleep 1
          done
          for i in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/ || true)" = "200" ]; then break; fi
            sleep 1
          done

          set +e
          {
            echo "API  /health  -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/health)"
            echo "API  /ready   -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4000/ready)"
            echo "Web  /        -> $(curl -s -o /tmp/web-home.html -w '%{http_code}' http://127.0.0.1:3100/)"
            echo "Web  404      -> $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3100/definitely-missing)"
            echo "title: $(grep -oE '<title>[^<]*</title>' /tmp/web-home.html | head -1)"
            echo "shell: $(grep -c 'nw-smooth' /tmp/web-home.html || true) site-chrome marker(s)"
          } | tee /tmp/probe.log
          set -e

          docker logs api > /tmp/api.log 2>&1 || true
          docker logs web > /tmp/web.log 2>&1 || true

          if ! grep -q "API  /health  -> 200" /tmp/probe.log; then
            cat /tmp/api.log
            echo "::error title=container probe::the API container did not answer /health"
            exit 1
          fi
          if ! grep -q "API  /ready   -> 200" /tmp/probe.log; then
            cat /tmp/api.log
            echo "::error title=container probe::the API container did not reach its database"
            exit 1
          fi
          if ! grep -q "Web  /        -> 200" /tmp/probe.log; then
            cat /tmp/web.log
            echo "::error title=container probe::the React Router container did not render the home page"
            exit 1
          fi
          if ! grep -q "Web  404      -> 404" /tmp/probe.log; then
            echo "::error title=container probe::an unknown route did not return 404"
            exit 1
          fi
          if ! grep -q "shell: [1-9]" /tmp/probe.log; then
            echo "::error title=container probe::the server-rendered home page is missing the site shell"
            exit 1
          fi
          echo "Both images build and serve: API health/ready and the React Router home page, 404 and site shell."
      - name: Stop the containers
        if: ${{ !cancelled() }}
        run: |
          docker rm -f api web > /dev/null 2>&1 || true
          docker network rm nw-ci > /dev/null 2>&1 || true

  # `pnpm check:ssr-parity` (the Phase 3 exit gate) lives in its own nightly
  # workflow — see .github/workflows/ssr-parity.yml — because it builds both
  # applications and is too slow to sit on the path of every commit.
  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs:
      - verify
      - postgres-integration
      - local-dev-chain
      - react-router-prototype
      - portable-stack
      - container-image
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
          LOCAL_CHAIN_RESULT: ${{ needs.local-dev-chain.result }}
          PROTOTYPE_RESULT: ${{ needs.react-router-prototype.result }}
          PORTABLE_STACK_RESULT: ${{ needs.portable-stack.result }}
          CONTAINER_RESULT: ${{ needs.container-image.result }}
        run: |
          printf 'verify: %s\npostgres-integration: %s\nlocal-dev-chain: %s\nreact-router-prototype: %s\nportable-stack: %s\ncontainer-image: %s\n' \
            "$VERIFY_RESULT" "$POSTGRES_RESULT" "$LOCAL_CHAIN_RESULT" "$PROTOTYPE_RESULT" "$PORTABLE_STACK_RESULT" "$CONTAINER_RESULT"
          for result in "$VERIFY_RESULT" "$POSTGRES_RESULT" "$LOCAL_CHAIN_RESULT" "$PROTOTYPE_RESULT" "$PORTABLE_STACK_RESULT" "$CONTAINER_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "::error::verify, postgres-integration, local-dev-chain, react-router-prototype, portable-stack and container-image must all succeed."
              exit 1
            fi
          done
          echo "All required validation jobs succeeded."
