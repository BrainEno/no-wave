name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Upload generated lockfile for dependency pinning
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexical-lockfile-bootstrap
          path: pnpm-lock.yaml
          if-no-files-found: error

      - name: Commit generated lockfile to the authoring branch
        if: github.ref == 'refs/heads/feat/lexical-authoring-loop-20261028'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "No lockfile change to persist."
          else
            git commit -m "chore(deps): pin Lexical workspace lockfile"
            git push origin HEAD:refs/heads/feat/lexical-authoring-loop-20261028
          fi
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:routes

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: bot_thk_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bot_thk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bot_thk_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "10.20.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @bot-thk/api test:integration

  required-checks:
    name: required-checks
    if: ${{ always() }}
    needs:
      - verify
      - postgres-integration
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job to succeed
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          POSTGRES_RESULT: ${{ needs.postgres-integration.result }}
        run: |
          printf 'verify: %s\npostgres-integration: %s\n' "$VERIFY_RESULT" "$POSTGRES_RESULT"
          if [ "$VERIFY_RESULT" != "success" ] || [ "$POSTGRES_RESULT" != "success" ]; then
            echo "::error::Both verify and postgres-integration must succeed."
            exit 1
          fi
          echo "All required validation jobs succeeded."
