stages:
  - verify
  - container

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  NEXT_TELEMETRY_DISABLED: "1"

verify:
  image: node:24-alpine
  stage: verify
  before_script:
    - corepack enable
    - pnpm --version
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm typecheck
    - pnpm build
    - pnpm test:routes
  rules:
    - if: $CI_COMMIT_BRANCH

container-smoke:
  image: docker:27-cli
  stage: container
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker info
    - docker build -f apps/web/Dockerfile -t bot-thk:ci .
    - docker run --detach --name bot-thk-smoke --publish 3000:3000 bot-thk:ci
    - |
      for attempt in $(seq 1 30); do
        if docker exec bot-thk-smoke node -e "fetch('http://127.0.0.1:3000/', { signal: AbortSignal.timeout(1500) }).then(async r => { const body = await r.text(); if (!r.ok || !/<html lang=.zh-TW./.test(body) || !body.includes('可移植的 Web 基礎架構')) { console.error('Home probe failed: HTTP', r.status, 'body:', body.slice(0, 300)); process.exit(1); } process.exit(0); }).catch(error => { console.error('Home probe request failed:', error.message); process.exit(1); })"; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          docker logs bot-thk-smoke
          exit 1
        fi
        sleep 2
      done
    - docker exec bot-thk-smoke node -e "fetch('http://127.0.0.1:3000/articles/does-not-exist').then(r => { if (r.status !== 404) process.exit(1); process.exit(0) }).catch(() => process.exit(1))"
    - docker exec bot-thk-smoke node -e "fetch('http://127.0.0.1:3000/articles/portable-web-foundation').then(async r => { const body = await r.text(); if (!r.ok || !body.includes('canonical')) process.exit(1); process.exit(0) }).catch(() => process.exit(1))"
  after_script:
    - docker rm --force bot-thk-smoke >/dev/null 2>&1 || true
  rules:
    - if: $CI_COMMIT_BRANCH

postgres-integration:
  image: node:24-alpine
  stage: verify
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    POSTGRES_DB: bot_thk_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot_thk_test
  before_script:
    - corepack enable
    - pnpm --version
    - |
      for attempt in $(seq 1 30); do
        if node -e "const s = require('node:net').connect(5432, 'postgres', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "PostgreSQL test service did not become ready"
          exit 1
        fi
        sleep 1
      done
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @bot-thk/api test:integration
  rules:
    - if: $CI_COMMIT_BRANCH
