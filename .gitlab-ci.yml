stages:
  - verify
  - container

variables:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

# The React Router build uses esbuild, whose lockfile entry is the glibc binary.
# node:24-alpine (musl) cannot run it; GitHub Actions and apps/web-rr/Dockerfile
# both use the Debian slim image, so GitLab does too.
verify:
  image: node:24-slim
  stage: verify
  before_script:
    - corepack enable
    - pnpm --version
  script:
    - pnpm install --frozen-lockfile
    - pnpm test
    - pnpm typecheck
    - pnpm build
    - pnpm test:routes
  rules:
    - if: $CI_COMMIT_BRANCH

container-smoke:
  image: docker:27-cli
  stage: container
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
  script:
    - docker info
    - docker build -f apps/web-rr/Dockerfile -t bot-thk:ci .
    # apps/web-rr/Dockerfile sets PORT/EXPOSE 3100. Map and probe that port, not
    # the retired 3000, and let the shared checker own readiness and assertions.
    - docker run --detach --name bot-thk-smoke --publish 3100:3100 -e HOST=0.0.0.0 -e PORT=3100 bot-thk:ci
    # The Web runtime image has Node 24 but not the workspace dev dependencies;
    # copy just the dependency-free checker into its working directory.
    - docker cp scripts/container-smoke.ts bot-thk-smoke:/app/apps/web-rr/container-smoke.ts
    - |
      if ! docker exec -e SMOKE_WEB_URL=http://127.0.0.1:3100 -e SMOKE_EXPECT_FIXTURES=true -e SMOKE_TIMEOUT_MS=60000 bot-thk-smoke node container-smoke.ts; then
        docker logs bot-thk-smoke
        exit 1
      fi
  after_script:
    - docker rm --force bot-thk-smoke >/dev/null 2>&1 || true
  rules:
    - if: $CI_COMMIT_BRANCH

postgres-integration:
  image: node:24-slim
  stage: verify
  services:
    - name: postgres:17-alpine
      alias: postgres
  variables:
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    POSTGRES_DB: bot_thk_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/bot_thk_test
  before_script:
    - corepack enable
    - pnpm --version
    - |
      for attempt in $(seq 1 30); do
        if node -e "const s = require('node:net').connect(5432, 'postgres', () => { s.end(); process.exit(0); }); s.on('error', () => process.exit(1));"; then
          break
        fi
        if [ "$attempt" -eq 30 ]; then
          echo "PostgreSQL test service did not become ready"
          exit 1
        fi
        sleep 1
      done
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter @bot-thk/api test:integration
  rules:
    - if: $CI_COMMIT_BRANCH
